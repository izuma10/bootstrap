<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <title>Pagina bootstrap nueva</title>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarToggleExternalContent"
            aria-controls="navbarToggleExternalContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
      </nav>
  
      <div class="collapse" id="navbarToggleExternalContent" data-bs-theme="dark">
        <div class="bg-dark p-4">
          <span class="text-body-secondary">Inicio</span>
          <span class="text-body-secondary">Precio</span>
          <span class="text-body-secondary">Contacto</span>
        </div>
      </div>
      <div class="container">
        <div class="row">
          <!-- Columna que ocupa todo el ancho en pantallas pequeñas y 4 unidades en pantallas medianas o más grandes -->
          <div class="col-12 col-md-4" style="background-color: #f9c2ff;">
            Columna 1 (col-12 col-md-4)
          </div>
          <!-- Columna que ocupa todo el ancho en pantallas pequeñas y 4 unidades en pantallas medianas o más grandes -->
          <div class="col-12 col-md-4" style="background-color: #f9f4ff;">
            Columna 2 (col-12 col-md-4)
          </div>
          <!-- Columna que ocupa todo el ancho en pantallas pequeñas y 4 unidades en pantallas medianas o más grandes -->
          <div class="col-12 col-md-4" style="background-color: #c2f9ff;">
            Columna 3 (col-12 col-md-4)
          </div>
        </div>

</body>
</html>
